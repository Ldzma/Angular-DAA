<mat-toolbar color="primary" class="header-toolbar">
  <div class="toolbar-container">
    <div class="logo-container">
      <mat-icon>store</mat-icon>
      <span>TIENDA DAA</span>
    </div>

    <mat-form-field appearance="outline" class="search-bar">
      <mat-label>Buscar...</mat-label>
      <input matInput placeholder="Buscar...">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <div class="nav-buttons">
      <button mat-button routerLink="/home">Inicio</button>
      <button mat-button routerLink="/products">Productos</button>
      <button mat-button routerLink="/contact">Contacto</button>
    </div>

    <button mat-icon-button [matBadge]="cartItems" matBadgeColor="warn" class="cart-button">
      <mat-icon>shopping_cart</mat-icon>
    </button>
  </div>
</mat-toolbar>
